services:
  postgres:
    image: postgres:16-alpine
    container_name: memecoin-pg
    environment:
      POSTGRES_USER: memecoin
      POSTGRES_PASSWORD: memecoin
      POSTGRES_DB: memecoin
    ports:
      - "5433:5432"
    volumes:
      - memecoin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memecoin"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  memecoin-pgdata:
